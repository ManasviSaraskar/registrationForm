<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

<div class="div1">
    <h2>Registration Form</h2>

    <form>
        <label>Full Name:</label><br>
        <input type="text" name="fullname" required><br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="dob" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other<br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone" required><br><br>

        <label>Highest Qualification:</label><br>
        <input type="text" name="qualification" required><br><br>

        <label>Percentage / CGPA:</label><br>
        <input type="number" step="0.01" name="marks" required><br><br>
</div>

<div class="div2">

        <label>Address:</label><br>
        <textarea rows="4" cols="30" required></textarea><br><br>

        <input type="checkbox" required>
        <label>I confirm that the above details are true.</label><br><br>

        <input type="submit" value="Submit Application">
        <input type="reset" value="Reset">

    </form>
</div>

</body>
</html>
